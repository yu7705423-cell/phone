<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<!-- 构建号。和 src/version.js 里的必须一致，由 scripts/check-build.mjs 拦着。
     HTML 比 js 子资源更容易被浏览器重新验证，所以拿它当「真实版本」，
     启动时和 version.js 一比就知道缓存里的 js 是不是旧的。见 src/main.js -->
<meta name="build" content="2026-09-21.52">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0E10" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent 才会让 WebView 铺满整屏、内容走到状态栏底下。
     default 会让 iOS 单独留一条状态栏,用 theme-color 填死,
     壁纸和页面都盖不到它。改完必须把主屏幕图标删掉重新添加,iOS 只在添加时读一次。 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小手机">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='6' y='2' width='12' height='20' rx='3' fill='none' stroke='%2326282E' stroke-width='1.6'/%3E%3Cpath d='M10 18h4' stroke='%2326282E' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<title>小手机</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/ui.css">
<link rel="stylesheet" href="styles/shell.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
