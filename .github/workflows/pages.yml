name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/mini-phone-architecture-tqzvig]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true 会在 Pages 尚未开启时自动开启，不需要手动去设置页打开
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 无构建，整个仓库直接作为静态站点上传
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
